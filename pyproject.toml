[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbe"
version = "0.1.0"
description = "Cyber-Butler Enforcement gate: rule-pack manifest, provider execution, no-bypass enforcement, and SARIF evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
]

[project.scripts]
cbe = "cbe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

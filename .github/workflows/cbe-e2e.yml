name: cbe-e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CBE and test tools
        run: python -m pip install -e . pytest pytest-cov
      - name: Run CBE E2E
        run: python tests/e2e/run_e2e.py --json
      - name: Coverage gate
        run: python -m pytest tests/unit --cov=cbe --cov-report=term-missing --cov-fail-under=60 --basetemp=.pytest-tmp-coverage

name: cbe-e2e

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install CBE and test tools
        run: python -m pip install -e ".[e2e]"
      - name: Verify self-protection manifest
        run: python tools/cbe_self_protect.py --check
      - name: Run CBE E2E
        run: python tests/e2e/run_e2e.py --json
      - name: Run mutation corpus
        run: python tests/mutation/run_mutations.py
      - name: Contract consistency tests
        run: python -m pytest tests/contract tests/self tests/sidecar tests/security tests/sbom tests/mutation
      - name: Coverage gate
        run: python -m pytest tests/unit --cov=cbe --cov-report=term-missing --cov-fail-under=80 --basetemp=.pytest-tmp-coverage

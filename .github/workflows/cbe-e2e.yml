name: cbe-e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CBE
        run: python -m pip install -e .
      - name: Run CBE E2E
        run: python tests/e2e/run_e2e.py --json

name: cbe-sign-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must not exist)
        required: true
        default: v0.3.0
      candidate_sha:
        description: Commit to build, sign, and tag
        required: true
      stage_only:
        description: Sign and upload a workflow artifact only; no tag/release/PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    name: build-once / sign / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build once
        run: |
          python -m pip install --upgrade pip build
          python -m pip install "jsonschema>=4.20" "pyyaml>=6.0"
          rm -rf dist
          python -m build --wheel --sdist --outdir dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - name: Generate release evidence
        run: |
          python tools/cbe_release_bundle.py \
            --artifacts-dir dist \
            --out-dir evidence \
            --version 0.2.0 \
            --tag "${{ inputs.tag }}" \
            --commit "${{ inputs.candidate_sha }}" \
            --workflow-ref "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-release.yml@${GITHUB_REF}"

      - name: Install cosign (pinned commit)
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v3.8.0
        with:
          cosign-release: v2.4.1

      - name: Sign every release evidence file
        run: |
          set -euo pipefail
          for file in dist/*.whl dist/*.tar.gz evidence/cbe-report.json evidence/attestation.json evidence/release-manifest.json; do
            echo "SIGNING $file"
            cosign sign-blob --yes \
              --bundle "$file.bundle" \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem" \
              "$file"
          done

      - name: Attest wheel and sdist (SLSA v1)
        run: |
          set -euo pipefail
          cosign attest-blob --yes \
            --predicate evidence/predicate.json \
            --type slsaprovenance1 \
            --bundle evidence/attestation-wheel.json \
            dist/*.whl
          cosign attest-blob --yes \
            --predicate evidence/predicate.json \
            --type slsaprovenance1 \
            --bundle evidence/attestation-sdist.json \
            dist/*.tar.gz

      - name: Verify every bundle
        env:
          IDENTITY_RE: "https://github.com/${{ github.repository }}/.github/workflows/sign-release.yml@${{ github.ref }}"
          ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          for file in dist/*.whl dist/*.tar.gz evidence/cbe-report.json evidence/attestation.json evidence/release-manifest.json; do
            cosign verify-blob \
              --bundle "$file.bundle" \
              --certificate-identity "$IDENTITY_RE" \
              --certificate-oidc-issuer "$ISSUER" \
              "$file"
          done
          cosign verify-blob-attestation \
            --bundle evidence/attestation-wheel.json \
            --type slsaprovenance1 \
            --certificate-identity "$IDENTITY_RE" \
            --certificate-oidc-issuer "$ISSUER" \
            dist/*.whl
          cosign verify-blob-attestation \
            --bundle evidence/attestation-sdist.json \
            --type slsaprovenance1 \
            --certificate-identity "$IDENTITY_RE" \
            --certificate-oidc-issuer "$ISSUER" \
            dist/*.tar.gz

      - name: CBE keyless verifier
        run: |
          set -euo pipefail
          python tools/cbe_verify_sidecar.py --keyless \
            --bundle-dir evidence \
            --artifact dist/*.whl \
            --artifact dist/*.tar.gz \
            --report evidence/cbe-report.json \
            --manifest evidence/release-manifest.json \
            --attestation evidence/attestation.json \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-release.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --cosign cosign

      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cbe-signed-release
          path: |
            dist/
            evidence/
          if-no-files-found: error

  publish:
    name: publish / tag after verification
    needs: sign
    if: ${{ !inputs.stage_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verifier dependencies
        run: python -m pip install "jsonschema>=4.20"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cbe-signed-release
          path: release-artifact

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v3.8.0
        with:
          cosign-release: v2.4.1

      - name: Re-verify signed artifact before tag
        env:
          IDENTITY_RE: "https://github.com/${{ github.repository }}/.github/workflows/sign-release.yml@${{ github.ref }}"
          ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          python tools/cbe_verify_sidecar.py --keyless \
            --bundle-dir release-artifact/evidence \
            --artifact release-artifact/dist/*.whl \
            --artifact release-artifact/dist/*.tar.gz \
            --report release-artifact/evidence/cbe-report.json \
            --manifest release-artifact/evidence/release-manifest.json \
            --attestation release-artifact/evidence/attestation.json \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-release.yml@.*" \
            --certificate-oidc-issuer "$ISSUER" \
            --cosign cosign

      - name: Create signed release and tag after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # CBE 0.2.0 — GATE-INTEGRITY RELEASE

          **SIGNED via GitHub OIDC keyless cosign/sigstore.**

          - Build: GitHub Actions, one build, from the tagged candidate commit.
          - Verification: every wheel/sdist/report/attestation/manifest has a
            cosign bundle; the workflow ran `cosign verify-blob` and the CBE
            keyless verifier before creating this tag.
          - Production signature is the Sigstore keyless bundle, not Ed25519.
          - No Ed25519 `manifest.sig` is produced or claimed as production.
          - Branch/tag protection is external; see the repository readiness page.

          Assets include `.bundle`, `.sig`, `.pem`, SLSA attestations and
          `release-manifest.json`.
          EOF
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ inputs.candidate_sha }}" \
            --title "CBE 0.2.0" \
            --notes-file release-notes.md \
            --draft
          gh release upload "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --clobber \
            release-artifact/dist/* \
            release-artifact/evidence/*
          # Only now publish the draft; this is the point where v0.2.0 becomes
          # a real tag. Signature verification ran before the draft was created.
          gh release edit "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY_RE: "https://github.com/${{ github.repository }}/.github/workflows/sign-release.yml@${{ github.ref }}"
          ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            -p 'cbe_review-*' \
            -p 'cbe-report.json*' \
            -p 'attestation.json*' \
            -p 'release-manifest.json*' \
            -D published
          for file in published/cbe_review-*.whl published/cbe_review-*.tar.gz published/cbe-report.json published/attestation.json published/release-manifest.json; do
            cosign verify-blob \
              --bundle "$file.bundle" \
              --certificate-identity "$IDENTITY_RE" \
              --certificate-oidc-issuer "$ISSUER" \
              "$file"
          done

  pypi:
    name: PyPI cbe-review 0.3.0
    needs: publish
    if: ${{ !inputs.stage_only }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download signed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist manifest
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            -p 'cbe_review-*.whl' \
            -p 'cbe_review-*.tar.gz' \
            -D dist
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            -p 'release-manifest.json' \
            -D manifest
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - name: Verify wheel/sdist hashes against signed manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("manifest/release-manifest.json").read_text(encoding="utf-8"))
          declared = {item["name"]: item["sha256"] for item in manifest["artifacts"]}
          problems = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if declared.get(path.name) != actual:
                  problems.append(f"{path.name}: {actual} != {declared.get(path.name)}")
          if problems:
              raise SystemExit("PYPI_DIGEST_MISMATCH: " + "; ".join(problems))
          print("PYPI_DIGEST_MATCH", declared)
          PY
          ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
